name: Secure Pipeline

# Fork pipeline in three stages, each gating the next:
#   1. tests:   the full test suite, sharded like ci.yml.
#   2. image:   builds the Docker image and smoke tests it as a running container in secure mode.
#   3. publish: pushes the exact image that passed stage 2 to GHCR (main and v* tags only).
#
# Pull requests are not a trigger here: ci.yml already runs the suite on them.

on:
  push:
    branches:
      - main
      - 'feat/**'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a work branch cancels the older run. main and tags always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

env:
  # Keep in sync with the matrix of the tests job (see the note in ci.yml).
  SHARD_TOTAL: 4

jobs:
  tests:
    name: Tests (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '25'
          distribution: 'temurin'

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}-

      - name: Compute shard include list
        run: |
          cd src/test/java
          find . \( -name '*Test.java' -o -name 'Test*.java' \
                    -o -name '*Tests.java' -o -name '*TestCase.java' \) \
            | sed 's|^\./||; s|\.java$||' | LC_ALL=C sort \
            > "$GITHUB_WORKSPACE/all-classes.txt"
          cd "$GITHUB_WORKSPACE"
          .github/ci/partition.sh all-classes.txt "$SHARD_TOTAL" "${{ matrix.shard }}" > shard.txt
          test -s shard.txt
          echo "shard ${{ matrix.shard }}/$SHARD_TOTAL: $(wc -l < shard.txt) classes"

      - name: Prefetch this shard's Docker images (background)
        run: .github/ci/prefetch-images.sh shard.txt || true

      - name: Compile
        run: ./mvnw test-compile -B

      - name: Run tests
        run: >
          ./mvnw surefire:test -B
          -Dsurefire.includesFile="$GITHUB_WORKSPACE/shard.txt"
          -Dsurefire.failIfNoTests=true
          -Dsurefire.timeout=1200

      - name: Upload shard results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: secure-shard-${{ matrix.shard }}
          path: |
            shard.txt
            target/surefire-reports/
          if-no-files-found: warn

  image:
    name: Build image and smoke test
    runs-on: ubuntu-latest
    needs: tests
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '25'
          distribution: 'temurin'

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}-

      - name: Package the application
        run: ./mvnw package -DskipTests -B

      - name: Build the image
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="sha-${GITHUB_SHA::7}"
          fi
          docker build -f docker/Dockerfile.jvm-package \
            --build-arg "VERSION=${version}" \
            -t floci-candidate:ci .

      - name: Smoke test the running image in secure mode
        run: .github/ci/secure-smoke.sh floci-candidate:ci

      - name: Save the tested image
        run: docker save floci-candidate:ci | gzip > floci-image.tar.gz

      - name: Upload the tested image
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: floci-image
          path: floci-image.tar.gz
          retention-days: 1
          if-no-files-found: error

  publish:
    name: Publish to GHCR
    runs-on: ubuntu-latest
    needs: image
    timeout-minutes: 15
    # Only main and version tags are published. Other branches stop after the smoke test.
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: floci-image

      - name: Load the image that passed the smoke test
        run: gunzip -c floci-image.tar.gz | docker load

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          image="ghcr.io/${owner}/floci"
          tags=("sha-${GITHUB_SHA::7}")
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tags+=("${GITHUB_REF_NAME#v}")
          else
            tags+=("latest")
          fi
          for tag in "${tags[@]}"; do
            docker tag floci-candidate:ci "${image}:${tag}"
            docker push "${image}:${tag}"
          done
          {
            echo "### Published"
            for tag in "${tags[@]}"; do
              echo "- \`${image}:${tag}\`"
            done
          } >> "$GITHUB_STEP_SUMMARY"
